[project]
name = "archmodel"
version = "0.1.0"
description = "Stage 1 core: structured architecture model, component catalogue and validated operations engine"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
archmodel = "archmodel.cli:main"
orgknow = "orgknow.cli:main"
reqgen = "reqgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
